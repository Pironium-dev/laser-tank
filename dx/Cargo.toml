[package]
name = "dx"
version = "0.1.0"
authors = ["Pironium <94836916+Pironium-dev@users.noreply.github.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
gilrs = "0.11.1"
tokio = { version = "1.50.0", features = ["macros", "net", "rt", "time"] }
communication = { path = "../communication/" }
postcard = { version = "1.1.3", features = ["experimental-derive"] }
serde = { version = "1.0.228", features = ["derive"] }
async-stream = "0.3.6"
futures-core = "0.3.32"
futures-util = "0.3.32"
tokio-util = "0.7.18"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[build-dependencies]
dotenvy = "0.15"
