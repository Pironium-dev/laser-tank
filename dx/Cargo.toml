[package]
name = "dx"
version = "0.1.0"
authors = ["Pironium <94836916+Pironium-dev@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
gilrs = "0.11.1"
tokio = { version = "1.50.0", features = ["macros", "rt", "time"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[build-dependencies]
dotenvy = "0.15"
