[package]
edition      = "2024"
name         = "esp32"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }

embassy-net = { version = "0.8.0", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.9.1", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.17.0", features = [
  "esp-alloc",
  "esp32",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
embassy-futures = "0.1.2"
communication = { version = "0.1.0", path = "../communication" }
esp-println = {version = "0.16.1", features = ["esp32"]}
postcard = { version = "1.1.3", features = ["experimental-derive"] }
futures = {version = "0.3.32", default-features = false, features=["async-await",]}

[build-dependencies]
dotenvy = "0.15.7"
